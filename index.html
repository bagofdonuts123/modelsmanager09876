<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Model Manager Pro</title>
   <link rel="stylesheet" href="style.css">
   <script src="https://unpkg.com/@phosphor-icons/web"></script>

   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

   <!-- ── LOGIN SCREEN ─────────────────────────────── -->
   <div id="loginScreen" class="login-screen">
      <div class="login-card">
         <div class="login-logo"><i class="ph ph-shield-check"></i></div>
         <h1 class="login-title">Model Manager</h1>
         <p class="login-sub">Sign in to continue</p>

         <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
         </div>
         <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
         </div>

         <div id="loginError" class="login-error hidden"></div>

         <button id="loginBtn" class="btn primary login-btn">
            <i class="ph ph-sign-in"></i> Sign In
         </button>
      </div>
   </div>

   <!-- ── LOADING SCREEN ────────────────────────────── -->
   <div id="loadingScreen" class="loading-screen">
      <i class="ph ph-circle-notch ph-spin"></i>
   </div>

   <!-- ── MAIN APP (hidden until authenticated) ──────── -->
   <div class="layout hidden" id="appLayout">
      <aside class="sidebar">
         <div class="sidebar-header">
            <h2>Library</h2>
            <div class="header-actions">
               <button id="settingsBtn" title="Settings" class="icon-btn"><i class="ph ph-gear"></i></button>
               <button id="manageTagsBtn" title="Manage Tags" class="icon-btn"><i class="ph ph-tag"></i></button>
               <button id="addCategoryBtn" title="Add Category" class="icon-btn primary"><i class="ph ph-plus"></i></button>
               <button id="logoutBtn" title="Sign Out" class="icon-btn"><i class="ph ph-sign-out"></i></button>
            </div>
         </div>

         <div class="nav-section-title">CATEGORIES</div>
         <div id="categoryList" class="category-list"></div>

         <div class="nav-section-title" style="margin-top: 20px;">TAGS</div>
         <div id="tagSidebarList" class="category-list"></div>
      </aside>

      <main class="main-content">
         <header class="top-bar">
            <div class="bar-left">
               <h2 id="currentViewTitle">All Models</h2>
               <span id="itemCount" class="badge">0 items</span>
            </div>
            <div class="bar-right">
               <div class="search-wrapper">
                  <i class="ph ph-magnifying-glass"></i>
                  <input type="text" id="searchInput" placeholder="Search models...">
               </div>
               <button id="bulkAddBoxBtn" class="btn ghost"><i class="ph ph-list-plus"></i> Bulk Add</button>
               <button id="addBoxBtn" class="btn primary"><i class="ph ph-plus"></i> Add Model</button>
            </div>
         </header>

         <div id="boxContainer" class="box-grid"></div>
      </main>

      <aside class="info-panel" id="infoPanel">
         <div class="empty-state">
            <i class="ph ph-cursor-click"></i>
            <p>Select a model to view details</p>
         </div>
         <div id="infoContent" class="info-content hidden"></div>
      </aside>
   </div>

   <!-- ── MODAL ──────────────────────────────────────── -->
   <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal">
         <header class="modal-header">
            <h3 id="modalTitle">Title</h3>
            <button class="close-modal"><i class="ph ph-x"></i></button>
         </header>
         <div id="modalBody" class="modal-body"></div>
         <footer class="modal-footer">
            <button class="btn ghost close-modal">Close</button>
            <button id="modalConfirmBtn" class="btn primary">Confirm</button>
         </footer>
      </div>
   </div>

   <script src="app.js"></script>
</body>
</html>
