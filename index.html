<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Lumen Vault</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
   <script src="https://unpkg.com/@phosphor-icons/web"></script>
   <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
   <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
   <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

   <!-- WebGL Background Canvas -->
   <canvas id="bgCanvas"></canvas>

   <!-- LOGIN SCREEN -->
   <div id="loginScreen" class="login-screen">
      <div class="login-card">
         <div class="login-logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
               <rect x="4" y="4" width="14" height="14" rx="3" fill="#2B6B51" opacity="0.9"/>
               <rect x="22" y="4" width="14" height="14" rx="3" fill="#2B6B51" opacity="0.5"/>
               <rect x="4" y="22" width="14" height="14" rx="3" fill="#2B6B51" opacity="0.7"/>
               <rect x="22" y="22" width="14" height="14" rx="3" fill="#2B6B51" opacity="0.35"/>
            </svg>
         </div>
         <h1 class="login-title kinetic-brand">Lumen Vault</h1>
         <p class="login-sub">Sign in to your archive</p>
         <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
         </div>
         <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
         </div>
         <div id="loginError" class="login-error hidden"></div>
         <button id="loginBtn" class="btn primary login-btn">
            <i class="ph ph-sign-in"></i> Sign In
         </button>
      </div>
   </div>

   <!-- LOADING SCREEN -->
   <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
   </div>

   <!-- MAIN APP -->
   <div class="layout">
      <aside class="sidebar">
         <div class="sidebar-header">
            <h2 class="brand kinetic-brand">Lumen Vault</h2>
            <div class="header-actions">
               <button id="settingsBtn" title="Settings" class="icon-btn" data-tooltip="Settings">
                  <i class="ph ph-gear"></i>
               </button>
               <button id="manageTagsBtn" title="Manage Tags" class="icon-btn" data-tooltip="Tags">
                  <i class="ph ph-tag"></i>
               </button>
               <button id="addCategoryBtn" title="Add Category" class="icon-btn primary" data-tooltip="New Collection">
                  <i class="ph ph-plus"></i>
               </button>
               <button id="logoutBtn" title="Sign Out" class="icon-btn" data-tooltip="Sign Out">
                  <i class="ph ph-sign-out"></i>
               </button>
            </div>
         </div>
         <div class="nav-section-title">COLLECTIONS</div>
         <div id="categoryList" class="category-list"></div>
         <div class="sidebar-divider"></div>
         <div class="nav-section-title">TAGS</div>
         <div id="tagSidebarList" class="category-list"></div>
      </aside>

      <main class="main-content">
         <header class="top-bar">
            <div class="bar-left">
               <h2 id="currentViewTitle">All Models</h2>
               <span id="itemCount" class="badge">0 items</span>
            </div>
            <div class="bar-right">
               <div class="search-wrapper">
                  <i class="ph ph-magnifying-glass"></i>
                  <input type="text" id="searchInput" placeholder="Search archive...">
               </div>
               <button id="bulkAddBoxBtn" class="btn ghost"><i class="ph ph-list-plus"></i> Batch Import</button>
               <button id="addBoxBtn" class="btn primary"><i class="ph ph-plus"></i> Add Image</button>
            </div>
         </header>
         <div id="boxContainer" class="box-grid"></div>
      </main>

      <aside class="info-panel" id="infoPanel">
         <div class="empty-state">
            <svg class="empty-icon" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
               <rect x="8" y="8" width="32" height="32" rx="6"/>
               <circle cx="18" cy="18" r="3"/>
               <path d="M8 32l10-10 8 8 6-6 8 8"/>
            </svg>
            <p class="kinetic-text">Select an item to inspect</p>
         </div>
         <div id="infoContent" class="info-content hidden"></div>
      </aside>
   </div>

   <!-- MODAL -->
   <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal">
         <header class="modal-header">
            <h3 id="modalTitle">Title</h3>
            <button class="close-modal icon-btn"><i class="ph ph-x"></i></button>
         </header>
         <div id="modalBody" class="modal-body"></div>
         <footer class="modal-footer">
            <button class="btn ghost close-modal">Close</button>
            <button id="modalConfirmBtn" class="btn primary">Confirm</button>
         </footer>
      </div>
   </div>

   <script src="app.js"></script>
   <script src="effects.js"></script>
</body>
</html>
